
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Racer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="game-container">

        <header>
            <h1>STREET RACER</h1>
            <p class="subtitle">HIGH SPEED CHALLENGE</p>
        </header>

        <section class="scoreboard">
            <div>
                <span>SCORE</span>
                <strong id="score">0</strong>
            </div>

            <div>
                <span>BEST</span>
                <strong id="highScore">0</strong>
            </div>

            <div>
                <span>SPEED</span>
                <strong id="speed">0</strong>
            </div>
        </section>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="600"></canvas>

            <div id="overlay" class="overlay">
                <h2 id="overlayTitle">STREET RACER</h2>
                <p id="overlayMessage">Ready to race?</p>
                <button id="overlayButton">START RACE</button>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn">START</button>
            <button id="pauseBtn">PAUSE</button>
            <button id="restartBtn">RESTART</button>
        </div>

        <p class="instructions">
            Use ← and → arrow keys to control your car.
        </p>

        <p class="footer">AVOID TRAFFIC. BEAT YOUR RECORD.</p>

    </main>

    <script src="game.js"></script>
</body>
</html>
